<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Udhampur District Progress Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .hidden { display: none !important; }
        .sticky-col-1 { position: sticky; left: 0; z-index: 10; background-color: white; }
        .sticky-col-2 { position: sticky; left: 280px; z-index: 10; background-color: white; }
        
        /* New CSS to lock the screen */
        body:has(#login-view:not(.hidden)) { overflow: hidden; height: 100vh; }
        body:has(#login-view:not(.hidden)) footer { display: none; }
        
        #login-view { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Scrollable content inside the card if screen is small */
        #login-card-container { 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        #login-card-container::-webkit-scrollbar { display: none; }

        @keyframes slowBlinkColor {
            0%, 100% { opacity: 1; color: #0f172a; }
            25% { color: #1d4ed8; }
            50% { opacity: 0.4; color: #b91c1c; }
            75% { color: #047857; }
        }
        .animate-header-pulse { animation: slowBlinkColor 3.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-16 min-h-screen">

    <div id="popup-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div id="modal-box" class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-sm w-full p-6 text-center transform scale-95 transition-transform duration-300">
            <div id="modal-icon-wrapper" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4">
                <svg id="modal-icon-success" class="h-6 w-6 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                <svg id="modal-icon-error" class="h-6 w-6 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 mb-1">Notification</h3>
            <p id="modal-message" class="text-sm text-slate-500 mb-6 px-2"></p>
            <button onclick="closePopupModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 px-4 rounded-xl shadow-xs transition cursor-pointer">Dismiss</button>
        </div>
    </div>

    <div id="login-view" class="h-screen w-full flex items-center justify-center relative bg-slate-900 px-4">
        <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-blue-600/20 blur-[120px] pointer-events-none"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[500px] h-[500px] rounded-full bg-emerald-600/15 blur-[100px] pointer-events-none"></div>
        
        <div id="login-card-container" class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl max-w-4xl w-full border border-white/20 overflow-hidden grid grid-cols-1 md:grid-cols-12 relative z-10">
            <div class="md:col-span-5 bg-slate-900 p-8 flex flex-col justify-between text-white border-r border-slate-700/30">
                <div><span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-[10px] font-bold uppercase border border-blue-500/20"><span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span> Official Portal</span></div>
                <div class="my-auto py-8">
                    <h2 class="text-3xl font-extrabold text-white">JKRLM FY 2026-27</h2>
                    <p class="text-sm text-slate-400 mt-3">Secure digital hub for performance tracking.</p>
                </div>
                <div class="border-t border-slate-700/40 pt-4 text-slate-500 text-[11px] font-mono"><span>DISTRICT UDHAMPUR</span></div>
            </div>
            <div class="md:col-span-7 p-8 md:p-12 flex flex-col justify-center bg-white">
                <h3 class="text-2xl font-bold text-slate-900 mb-6">Welcome Back</h3>
                <div class="space-y-4">
                    <input type="text" id="username" placeholder="Username" class="w-full border p-3 rounded-xl bg-slate-50 text-sm">
                    <input type="password" id="password" placeholder="Password" class="w-full border p-3 rounded-xl bg-slate-50 text-sm">
                    <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl cursor-pointer">Sign In</button>
                    <p id="login-error" class="text-red-500 text-xs text-center hidden"></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="fixed bottom-0 left-0 right-0 bg-slate-900 text-slate-300 py-3.5 px-6 border-t border-slate-800 text-center text-xs">
        <p>© 2026 JKRLM Framework Core</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
